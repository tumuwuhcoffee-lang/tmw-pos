name: Build and Release Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "=== Java Version ==="
          java -version
          echo "JAVA_HOME: $JAVA_HOME"
          JAVA_MAJOR=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}' | awk -F. '{print $1}')
          echo "Detected Java Major Version: $JAVA_MAJOR"
          if [ -z "$JAVA_MAJOR" ]; then
            echo "Error: Failed to detect Java version."
            exit 1
          fi
          if [ "$JAVA_MAJOR" -lt 17 ]; then
            echo "Error: Java version must be 17 or higher. Detected: $JAVA_MAJOR"
            exit 1
          fi
          echo "Java environment confirmed: Java $JAVA_MAJOR (>= 17)."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ -f "./debug.keystore" ]; then
            echo "debug.keystore already exists. Skipping generation."
          else
            echo "Generating temporary debug keystore..."
            keytool -genkey -v \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi

          if [ ! -f "./debug.keystore" ]; then
            echo "Error: debug.keystore does not exist and could not be generated."
            exit 1
          fi
          echo "Temporary debug keystore verified."

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        run: |
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$EXPECTED_APK" ]; then
            echo "Error: Expected debug APK not found at $EXPECTED_APK"
            echo "Discovered APK files inside app/build/outputs/apk:"
            if [ -d "app/build/outputs/apk" ]; then
              find app/build/outputs/apk -type f -name "*.apk"
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi

          if [ ! -s "$EXPECTED_APK" ]; then
            echo "Error: Debug APK file is empty at $EXPECTED_APK"
            exit 1
          fi

          if [[ "$EXPECTED_APK" != *.apk ]]; then
            echo "Error: File does not have .apk extension: $EXPECTED_APK"
            exit 1
          fi

          echo "Debug APK verified successfully: $EXPECTED_APK"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          REPO_NAME=$(basename "${{ github.repository }}" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9._-]/-/g')
          RUN_NUM="${{ github.run_number }}"
          ASSET_NAME="${REPO_NAME}-debug-build-${RUN_NUM}.apk"
          TEMP_DIR=$(mktemp -d -t apk-release-XXXXXX)
          ASSET_PATH="${TEMP_DIR}/${ASSET_NAME}"

          cp "app/build/outputs/apk/debug/app-debug.apk" "$ASSET_PATH"

          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "Error: Failed to prepare APK release asset at $ASSET_PATH"
            exit 1
          fi

          echo "Prepared APK release asset: $ASSET_PATH"
          echo "asset_path=$ASSET_PATH" >> "$GITHUB_OUTPUT"
          echo "asset_name=$ASSET_NAME" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh --version
          RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="Debug APK Build #${{ github.run_number }}"
          ASSET_PATH="${{ steps.prepare_asset.outputs.asset_path }}"

          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "Error: Release asset is missing or empty: $ASSET_PATH"
            exit 1
          fi

          NOTES="### Automatic Debug APK Build
          - **Build Status**: Built automatically by GitHub Actions
          - **Run Number**: #${{ github.run_number }}
          - **Run Attempt**: ${{ github.run_attempt }}
          - **Source Commit**: ${{ github.sha }}
          - **Purpose**: Intended for testing and evaluation
          - **Notice**: Not a Play Store production release. Signed with a temporary debug keystore."

          gh release create "$RELEASE_TAG" "$ASSET_PATH" \
            --title "$RELEASE_TITLE" \
            --notes "$NOTES" \
            --target "${{ github.sha }}" \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"

          if [ "${{ steps.publish_release.outcome }}" = "success" ]; then
            echo "=== Release Published Successfully ==="
            RELEASE_URL=$(gh release view "$RELEASE_TAG" --json url -q .url 2>/dev/null || echo "https://github.com/${{ github.repository }}/releases/tag/${RELEASE_TAG}")
            echo "Release Tag: $RELEASE_TAG"
            echo "Release Title: Debug APK Build #${{ github.run_number }}"
            echo "Release URL: $RELEASE_URL"
            echo "APK Asset Filename: $ASSET_NAME"

            echo "## 🚀 Debug APK Build & Release Summary" >> $GITHUB_STEP_SUMMARY
            echo "✅ **Debug APK built and published successfully!**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "- **Download APK from Release**: [$ASSET_NAME]($RELEASE_URL)" >> $GITHUB_STEP_SUMMARY
            echo "- **Release Page**: [$RELEASE_URL]($RELEASE_URL)" >> $GITHUB_STEP_SUMMARY
            echo "- **Release Tag**: \`$RELEASE_TAG\`" >> $GITHUB_STEP_SUMMARY
            echo "- **Direct Download**: Download the \`.apk\` directly from the Assets section of the release page on your Android phone." >> $GITHUB_STEP_SUMMARY
            echo "- **Backup Artifact**: The standard Actions artifact \`app-debug-apk\` is also preserved in this workflow run." >> $GITHUB_STEP_SUMMARY
          else
            echo "=== Release Publishing Warning ==="
            echo "Warning: GitHub Release publishing could not be completed."
            echo "The APK build succeeded and the Actions artifact 'app-debug-apk' remains available."

            echo "## ⚠️ Debug APK Build Summary" >> $GITHUB_STEP_SUMMARY
            echo "✅ **Debug APK built successfully!**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "⚠️ **GitHub Release publishing did not complete**, but the APK is safely saved." >> $GITHUB_STEP_SUMMARY
            echo "- **Backup Artifact**: Download \`app-debug-apk\` from the **Artifacts** section of this workflow run page." >> $GITHUB_STEP_SUMMARY
          fi
